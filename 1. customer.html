<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshBasket - Customer</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#f7f8fa;color:#172018}
.card{background:#fff;border:1px solid #e8ece9;border-radius:18px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.green{background:#16a34a;color:white}
.green:hover{background:#15803d}
.soft{background:#ecfdf3;color:#15803d}
.hidden{display:none!important}
input,select{outline:none}
input:focus,select:focus{border-color:#16a34a!important;box-shadow:0 0 0 3px #dcfce7}
.product-card{transition:.2s}
.product-card:hover{transform:translateY(-3px);box-shadow:0 10px 25px #00000010}
</style>
</head>

<body>

<header class="bg-white border-b sticky top-0 z-40">
<div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-4">

<div class="text-2xl font-extrabold text-green-600">
FreshBasket
</div>

<div class="flex-1 min-w-[220px]">
<input id="search"
       oninput="renderProducts()"
       class="w-full border rounded-xl px-4 py-3"
       placeholder="Search fruits, vegetables, milk...">
</div>

<button onclick="openCart()" class="btn green">
🛒 Cart <span id="cartCount">0</span>
</button>

<button onclick="showOrders()" class="btn soft">
My Orders
</button>

</div>
</header>

<section class="max-w-7xl mx-auto px-4 py-8">

<div class="rounded-3xl bg-green-600 text-white p-8 md:p-12 mb-8">
<h1 class="text-3xl md:text-5xl font-extrabold">
Fresh Groceries. Better Prices.
</h1>
<p class="mt-3 text-green-50">
Shop from local stores and get your groceries delivered.
</p>
</div>

<div class="flex gap-2 overflow-auto mb-6">
<button class="btn green" onclick="setCategory('All')">All</button>
<button class="btn soft" onclick="setCategory('Fruits')">Fruits</button>
<button class="btn soft" onclick="setCategory('Vegetables')">Vegetables</button>
<button class="btn soft" onclick="setCategory('Dairy')">Dairy</button>
<button class="btn soft" onclick="setCategory('Grocery')">Grocery</button>
<button class="btn soft" onclick="setCategory('Beverages')">Beverages</button>
<button class="btn soft" onclick="setCategory('Snacks')">Snacks</button>
</div>

<div class="flex justify-between items-center mb-4">
<h2 class="text-2xl font-extrabold">Popular Products</h2>
<span id="resultCount" class="text-gray-500"></span>
</div>

<div id="products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"></div>

</section>

<!-- CART -->
<div id="cartModal" class="hidden fixed inset-0 bg-black/50 z-50">
<div class="absolute right-0 top-0 h-full w-full max-w-md bg-white p-5 overflow-y-auto">

<div class="flex justify-between items-center mb-5">
<h2 class="text-2xl font-extrabold">Your Cart</h2>
<button onclick="closeCart()" class="text-2xl">×</button>
</div>

<div id="cartShop" class="mb-4"></div>
<div id="cartItems"></div>

<div id="cartSummary" class="mt-5"></div>

</div>
</div>

<!-- CHECKOUT -->
<div id="checkoutModal" class="hidden fixed inset-0 bg-black/50 z-50">
<div class="bg-white rounded-2xl max-w-lg mx-auto mt-10 p-6">

<h2 class="text-2xl font-extrabold mb-5">Checkout</h2>

<input id="customerName"
 class="w-full border rounded-xl px-4 py-3 mb-3"
 placeholder="Full Name">

<input id="customerPhone"
 class="w-full border rounded-xl px-4 py-3 mb-3"
 placeholder="10 Digit Mobile Number"
 maxlength="10">

<textarea id="customerAddress"
 class="w-full border rounded-xl px-4 py-3 mb-3"
 rows="3"
 placeholder="Delivery Address"></textarea>

<select id="paymentMethod"
 class="w-full border rounded-xl px-4 py-3 mb-4">
<option value="COD">Cash on Delivery</option>
<option value="ONLINE">Online Payment</option>
</select>

<div id="checkoutSummary" class="border rounded-xl p-4 mb-4"></div>

<div class="flex gap-2">
<button onclick="closeCheckout()" class="btn bg-gray-100 flex-1">
Cancel
</button>
<button onclick="placeOrder()" class="btn green flex-1">
Place Order
</button>
</div>

</div>
</div>

<!-- ORDERS -->
<div id="ordersModal" class="hidden fixed inset-0 bg-black/50 z-50">
<div class="bg-white rounded-2xl max-w-3xl mx-auto mt-10 p-6 max-h-[90vh] overflow-y-auto">

<div class="flex justify-between mb-5">
<h2 class="text-2xl font-extrabold">My Orders</h2>
<button onclick="closeOrders()" class="text-2xl">×</button>
</div>

<div id="orders"></div>

</div>
</div>

<script>

const FREE_DELIVERY_LIMIT = 199;
const DELIVERY_CHARGE = 30;
const PLATFORM_CHARGE = 30;

const PRODUCTS_KEY = "freshBasketProducts";
const ORDERS_KEY = "freshBasketOrders";
const CART_KEY = "freshBasketCart";

let category = "All";

const defaultProducts = [
{
id:"p1",
name:"Fresh Apple",
category:"Fruits",
weight:"1 Kg",
price:120,
originalPrice:150,
shopId:"shop1",
shopName:"Fresh Mart",
image:"https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=500"
},
{
id:"p2",
name:"Banana",
category:"Fruits",
weight:"1 Dozen",
price:60,
originalPrice:75,
shopId:"shop1",
shopName:"Fresh Mart",
image:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=500"
},
{
id:"p3",
name:"Tomato",
category:"Vegetables",
weight:"1 Kg",
price:50,
originalPrice:65,
shopId:"shop2",
shopName:"Daily Needs Store",
image:"https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=500"
},
{
id:"p4",
name:"Potato",
category:"Vegetables",
weight:"1 Kg",
price:40,
originalPrice:50,
shopId:"shop2",
shopName:"Daily Needs Store",
image:"https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=500"
},
{
id:"p5",
name:"Milk",
category:"Dairy",
weight:"1 Litre",
price:65,
originalPrice:70,
shopId:"shop3",
shopName:"Green Basket",
image:"https://images.unsplash.com/photo-1550583724-b2692b85b150?w=500"
},
{
id:"p6",
name:"Bread",
category:"Grocery",
weight:"400 g",
price:45,
originalPrice:55,
shopId:"shop3",
shopName:"Green Basket",
image:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500"
},
{
id:"p7",
name:"Orange Juice",
category:"Beverages",
weight:"1 Litre",
price:110,
originalPrice:130,
shopId:"shop4",
shopName:"City Grocery",
image:"https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=500"
},
{
id:"p8",
name:"Potato Chips",
category:"Snacks",
weight:"100 g",
price:30,
originalPrice:40,
shopId:"shop4",
shopName:"City Grocery",
image:"https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=500"
}
];

let products = JSON.parse(localStorage.getItem(PRODUCTS_KEY));

if(!Array.isArray(products) || products.length === 0){
products = defaultProducts;
localStorage.setItem(PRODUCTS_KEY,JSON.stringify(products));
}

let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];

function saveCart(){
localStorage.setItem(CART_KEY,JSON.stringify(cart));
updateCartCount();
}

function setCategory(value){
category=value;
renderProducts();
}

function renderProducts(){

let search=document.getElementById("search").value.toLowerCase();

let list=products.filter(p=>{

let categoryMatch =
category==="All" || p.category===category;

let searchMatch =
p.name.toLowerCase().includes(search) ||
p.category.toLowerCase().includes(search);

return categoryMatch && searchMatch;

});

document.getElementById("resultCount").innerText =
list.length+" products";

document.getElementById("products").innerHTML =
list.map(p=>{

let discount=0;

if(p.originalPrice>p.price){
discount=Math.round(
((p.originalPrice-p.price)/p.originalPrice)*100
);
}

return `
<div class="card product-card overflow-hidden">

<img src="${p.image}"
     class="w-full h-40 object-cover">

<div class="p-4">

<div class="text-xs text-green-600 font-bold">
${p.category}
</div>

<h3 class="font-bold mt-1">${p.name}</h3>

<p class="text-gray-500 text-sm">${p.weight}</p>

<div class="mt-3">
<span class="font-extrabold text-lg">
₹${p.price}
</span>

<span class="text-gray-400 line-through text-sm ml-1">
₹${p.originalPrice}
</span>

${discount ?
`<span class="text-green-600 text-xs font-bold ml-1">
${discount}% OFF
</span>`:""}

</div>

<div class="text-xs text-gray-500 mt-1">
🏪 ${p.shopName}
</div>

<button
onclick="addToCart('${p.id}')"
class="btn green w-full mt-3">
Add to Cart
</button>

</div>
</div>
`;

}).join("");

}

function addToCart(productId){

let product=products.find(p=>p.id===productId);

if(!product)return;

if(cart.length>0 && cart[0].shopId!==product.shopId){

let change=confirm(
`Your cart contains products from ${cart[0].shopName}.\n\n`+
`FreshBasket allows one shop per cart.\n\n`+
`Continue and replace current cart?`
);

if(!change)return;

cart=[];
}

let item=cart.find(x=>x.productId===productId);

if(item){
item.qty++;
}else{
cart.push({
productId:product.id,
shopId:product.shopId,
shopName:product.shopName,
qty:1
});
}

saveCart();
openCart();

}

function updateCartCount(){

document.getElementById("cartCount").innerText =
cart.reduce((sum,x)=>sum+x.qty,0);

}

function openCart(){

document.getElementById("cartModal").classList.remove("hidden");

renderCart();

}

function closeCart(){

document.getElementById("cartModal").classList.add("hidden");

}

function changeQty(productId,change){

let item=cart.find(x=>x.productId===productId);

if(!item)return;

item.qty+=change;

if(item.qty<=0){
cart=cart.filter(x=>x.productId!==productId);
}

saveCart();
renderCart();

}

function removeItem(productId){

cart=cart.filter(x=>x.productId!==productId);

saveCart();
renderCart();

}

function renderCart(){

let cartItems=document.getElementById("cartItems");
let summary=document.getElementById("cartSummary");

if(cart.length===0){

document.getElementById("cartShop").innerHTML="";
cartItems.innerHTML=`
<div class="text-center py-12 text-gray-500">
<div class="text-5xl mb-3">🛒</div>
Your cart is empty
</div>`;
summary.innerHTML="";
return;

}

document.getElementById("cartShop").innerHTML=`
<div class="bg-green-50 p-3 rounded-xl">
<b>Shop:</b> ${cart[0].shopName}
</div>
`;

let subtotal=0;

cartItems.innerHTML=cart.map(item=>{

let p=products.find(x=>x.id===item.productId);

if(!p)return "";

subtotal+=p.price*item.qty;

return `
<div class="flex gap-3 border-b py-4">

<img src="${p.image}"
class="w-16 h-16 rounded-xl object-cover">

<div class="flex-1">

<div class="font-bold">${p.name}</div>
<div class="text-sm text-gray-500">${p.weight}</div>
<div class="font-bold mt-1">₹${p.price*item.qty}</div>

<div class="flex items-center gap-2 mt-2">

<button onclick="changeQty('${p.id}',-1)"
class="bg-gray-100 px-3 py-1 rounded-lg">−</button>

<span>${item.qty}</span>

<button onclick="changeQty('${p.id}',1)"
class="bg-gray-100 px-3 py-1 rounded-lg">+</button>

<button onclick="removeItem('${p.id}')"
class="text-red-500 text-sm ml-2">
Remove
</button>

</div>

</div>
</div>
`;

}).join("");

let delivery =
subtotal>=FREE_DELIVERY_LIMIT ? 0 : DELIVERY_CHARGE;

let total =
subtotal+delivery+PLATFORM_CHARGE;

summary.innerHTML=`

<div class="space-y-2 text-sm">

<div class="flex justify-between">
<span>Subtotal</span>
<b>₹${subtotal}</b>
</div>

<div class="flex justify-between">
<span>Delivery</span>
<b>${delivery===0?"FREE":"₹"+delivery}</b>
</div>

<div class="flex justify-between">
<span>Taxes</span>
<b>₹0</b>
</div>

<div class="flex justify-between">
<span>Platform Charge</span>
<b>₹${PLATFORM_CHARGE}</b>
</div>

<hr>

<div class="flex justify-between text-xl font-extrabold">
<span>Total</span>
<span>₹${total}</span>
</div>

<button onclick="openCheckout()"
class="btn green w-full mt-4">
Proceed to Checkout
</button>

</div>
`;

}

function openCheckout(){

if(cart.length===0)return;

let subtotal=0;

cart.forEach(item=>{
let p=products.find(x=>x.id===item.productId);
if(p)subtotal+=p.price*item.qty;
});

let delivery=
subtotal>=FREE_DELIVERY_LIMIT?0:DELIVERY_CHARGE;

let total=
subtotal+delivery+PLATFORM_CHARGE;

document.getElementById("checkoutSummary").innerHTML=`

<div class="space-y-2">

<div class="font-bold mb-3">
🏪 ${cart[0].shopName}
</div>

<div class="flex justify-between">
<span>Subtotal</span>
<b>₹${subtotal}</b>
</div>

<div class="flex justify-between">
<span>Delivery</span>
<b>${delivery===0?"FREE":"₹"+delivery}</b>
</div>

<div class="flex justify-between">
<span>Taxes</span>
<b>₹0</b>
</div>

<div class="flex justify-between">
<span>Platform Charge</span>
<b>₹${PLATFORM_CHARGE}</b>
</div>

<hr>

<div class="flex justify-between font-extrabold text-xl">
<span>Total</span>
<span>₹${total}</span>
</div>

</div>
`;

document.getElementById("checkoutModal")
.classList.remove("hidden");

}

function closeCheckout(){
document.getElementById("checkoutModal").classList.add("hidden");
}

function placeOrder(){

let name=document.getElementById("customerName").value.trim();
let phone=document.getElementById("customerPhone").value.trim();
let address=document.getElementById("customerAddress").value.trim();
let payment=document.getElementById("paymentMethod").value;

if(!/^[A-Za-z ]{3,}$/.test(name)){
alert("Please enter a valid full name.");
return;
}

if(!/^[6-9][0-9]{9}$/.test(phone)){
alert("Please enter a valid 10 digit mobile number.");
return;
}

if(address.length<10){
alert("Please enter complete delivery address.");
return;
}

let subtotal=0;

let items=cart.map(item=>{

let p=products.find(x=>x.id===item.productId);

subtotal+=p.price*item.qty;

return {
productId:p.id,
name:p.name,
qty:item.qty,
price:p.price,
shopId:p.shopId,
shopName:p.shopName
};

});

let delivery=
subtotal>=FREE_DELIVERY_LIMIT?0:DELIVERY_CHARGE;

let total=
subtotal+delivery+PLATFORM_CHARGE;

let orders=
JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];

let order={
id:"FB"+Date.now(),
date:new Date().toLocaleString(),
customerName:name,
customerPhone:phone,
address:address,
shopId:cart[0].shopId,
shopName:cart[0].shopName,
items:items,
subtotal:subtotal,
delivery:delivery,
taxes:0,
platformCharge:PLATFORM_CHARGE,
total:total,
paymentMethod:payment,
status:"Order Placed",
cashCollected:payment==="COD"?false:true
};

orders.unshift(order);

localStorage.setItem(
ORDERS_KEY,
JSON.stringify(orders)
);

cart=[];
saveCart();

closeCheckout();
closeCart();

alert(
"Order placed successfully!\n\n"+
"Order ID: "+order.id+
"\nTotal: ₹"+total
);

}

function showOrders(){

let orders=
JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];

document.getElementById("orders").innerHTML=
orders.length===0
?
`<div class="text-center py-10 text-gray-500">
No orders yet.
</div>`
:
orders.map(o=>`

<div class="border rounded-2xl p-4 mb-4">

<div class="flex justify-between">
<div>
<b>${o.id}</b>
<div class="text-sm text-gray-500">${o.date}</div>
</div>

<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
${o.status}
</span>
</div>

<div class="mt-3">
<b>${o.shopName}</b>
</div>

<div class="text-sm text-gray-600 mt-2">
${o.items.map(i=>`${i.name} × ${i.qty}`).join("<br>")}
</div>

<div class="flex justify-between mt-4 font-extrabold">
<span>Total</span>
<span>₹${o.total}</span>
</div>

<div class="text-sm mt-2">
Payment: ${o.paymentMethod}
</div>

</div>

`).join("");

document.getElementById("ordersModal")
.classList.remove("hidden");

}

function closeOrders(){
document.getElementById("ordersModal").classList.add("hidden");
}

renderProducts();
updateCartCount();

</script>

</body>
</html>
