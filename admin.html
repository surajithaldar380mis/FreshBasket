<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FreshBasket - Admin Panel</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body{
font-family:Inter,sans-serif;
background:#f6f8fa;
}
.card{
background:white;
border:1px solid #e5e7eb;
border-radius:18px;
}
.btn{
padding:11px 16px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}
.green{
background:#16a34a;
color:white;
}
.red{
background:#fee2e2;
color:#dc2626;
}
</style>
</head>

<body>

<header class="bg-white border-b">

<div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

<div>
<div class="text-2xl font-extrabold text-green-600">
FreshBasket
</div>
<div class="text-xs text-gray-500">
Admin Panel
</div>
</div>

<button onclick="logout()" class="btn red">
Logout
</button>

</div>

</header>

<main class="max-w-7xl mx-auto px-4 py-6">

<div id="loginBox" class="max-w-md mx-auto card p-6 mt-10">

<h1 class="text-2xl font-extrabold mb-2">
Admin Login
</h1>

<p class="text-gray-500 mb-5">
FreshBasket Administration
</p>

<input id="adminId"
class="w-full border rounded-xl px-4 py-3 mb-3"
placeholder="Admin ID">

<input id="adminPassword"
type="password"
class="w-full border rounded-xl px-4 py-3 mb-4"
placeholder="Password">

<button onclick="login()" class="btn green w-full">
Login
</button>

<div class="bg-green-50 rounded-xl p-3 mt-4 text-sm">
Demo:<br>
ADMIN / FreshAdmin@2026
</div>

</div>

<div id="dashboard" class="hidden">

<h1 class="text-3xl font-extrabold mb-6">
Admin Dashboard
</h1>

<div class="grid md:grid-cols-4 gap-4 mb-6">

<div class="card p-5">
<div class="text-gray-500">Customers</div>
<div id="customerCount"
class="text-3xl font-extrabold mt-2">0</div>
</div>

<div class="card p-5">
<div class="text-gray-500">Shops</div>
<div id="shopCount"
class="text-3xl font-extrabold mt-2">0</div>
</div>

<div class="card p-5">
<div class="text-gray-500">Products</div>
<div id="productCount"
class="text-3xl font-extrabold mt-2">0</div>
</div>

<div class="card p-5">
<div class="text-gray-500">Orders</div>
<div id="orderCount"
class="text-3xl font-extrabold mt-2">0</div>
</div>

</div>

<div class="grid md:grid-cols-2 gap-5">

<div class="card p-5">

<h2 class="text-xl font-extrabold mb-4">
🏪 Shops
</h2>

<div id="shops"></div>

</div>

<div class="card p-5">

<h2 class="text-xl font-extrabold mb-4">
📦 Recent Orders
</h2>

<div id="orders"></div>

</div>

</div>

<div class="card p-5 mt-5">

<div class="flex justify-between items-center mb-4">

<h2 class="text-xl font-extrabold">
🛒 Product Management
</h2>

<input id="productSearch"
oninput="renderProducts()"
class="border rounded-xl px-4 py-2"
placeholder="Search product">

</div>

<div id="products"></div>

</div>

</div>

</main>

<script>

const ADMIN_ID="ADMIN";
const ADMIN_PASSWORD="FreshAdmin@2026";

const PRODUCTS_KEY="freshBasketProducts";
const ORDERS_KEY="freshBasketOrders";

const shops=[
{
id:"shop1",
name:"Fresh Mart",
location:"New Ashok Nagar",
rating:4.6
},
{
id:"shop2",
name:"Daily Needs Store",
location:"Mayur Vihar",
rating:4.5
},
{
id:"shop3",
name:"Green Basket",
location:"Laxmi Nagar",
rating:4.7
},
{
id:"shop4",
name:"City Grocery",
location:"Patparganj",
rating:4.4
}
];

let products=
JSON.parse(localStorage.getItem(PRODUCTS_KEY)) || [];

let orders=
JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];

function login(){

let id=
document.getElementById("adminId").value.trim();

let password=
document.getElementById("adminPassword").value;

if(id!==ADMIN_ID || password!==ADMIN_PASSWORD){

alert("Invalid Admin Login.");
return;

}

localStorage.setItem(
"freshBasketAdminLogin",
"true"
);

showDashboard();

}

function showDashboard(){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

renderStats();
renderShops();
renderOrders();
renderProducts();

}

function logout(){

localStorage.removeItem(
"freshBasketAdminLogin"
);

location.reload();

}

function renderStats(){

document.getElementById("customerCount")
.innerText="Customer data";

document.getElementById("shopCount")
.innerText=shops.length;

document.getElementById("productCount")
.innerText=products.length;

document.getElementById("orderCount")
.innerText=orders.length;

}

function renderShops(){

document.getElementById("shops").innerHTML=
shops.map(shop=>{

let productCount=
products.filter(
p=>p.shopId===shop.id
).length;

let shopOrders=
orders.filter(
o=>o.shopId===shop.id
).length;

return `

<div class="border rounded-xl p-4 mb-3">

<div class="flex justify-between">

<div>
<div class="font-extrabold">
${shop.name}
</div>

<div class="text-sm text-gray-500">
${shop.location}
</div>

<div class="text-sm mt-1">
⭐ ${shop.rating}
</div>
</div>

<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full h-fit text-sm">
Active
</span>

</div>

<div class="grid grid-cols-2 gap-2 mt-3 text-sm">

<div class="bg-gray-50 rounded-lg p-2">
Products<br>
<b>${productCount}</b>
</div>

<div class="bg-gray-50 rounded-lg p-2">
Orders<br>
<b>${shopOrders}</b>
</div>

</div>

</div>

`;

}).join("");

}

function renderOrders(){

document.getElementById("orders").innerHTML=
orders.length===0
?
`<div class="text-gray-500">
No orders yet.
</div>`
:
orders.slice(0,10).map(o=>`

<div class="border-b py-3">

<div class="flex justify-between">

<div>
<b>${o.id}</b>
<div class="text-xs text-gray-500">
${o.date}
</div>
</div>

<b>₹${o.total}</b>

</div>

<div class="text-sm mt-1">
${o.customerName}
</div>

<div class="text-xs text-gray-500">
${o.shopName}
</div>

<div class="text-xs mt-1 text-green-600">
${o.status}
</div>

</div>

`).join("");

}

function renderProducts(){

let search=
document.getElementById("productSearch")?.value
.toLowerCase() || "";

let list=products.filter(p=>
p.name.toLowerCase().includes(search) ||
p.category.toLowerCase().includes(search) ||
p.shopName.toLowerCase().includes(search)
);

document.getElementById("products").innerHTML=
list.length===0
?
`<div class="text-center py-8 text-gray-500">
No products found.
</div>`
:
`
<div class="overflow-x-auto">

<table class="w-full text-left">

<thead>
<tr class="border-b">
<th class="p-3">Product</th>
<th class="p-3">Shop</th>
<th class="p-3">Category</th>
<th class="p-3">Price</th>
<th class="p-3">Stock</th>
<th class="p-3">Action</th>
</tr>
</thead>

<tbody>

${list.map(p=>`

<tr class="border-b">

<td class="p-3">

<div class="flex items-center gap-3">

<img src="${p.image}"
class="w-12 h-12 rounded-lg object-cover">

<div>
<div class="font-bold">
${p.name}
</div>

<div class="text-xs text-gray-500">
${p.weight}
</div>
</div>

</div>

</td>

<td class="p-3">
${p.shopName}
</td>

<td class="p-3">
${p.category}
</td>

<td class="p-3 font-bold">
₹${p.price}
</td>

<td class="p-3">
${p.stock ?? 50}
</td>

<td class="p-3">

<button
onclick="deleteProduct('${p.id}')"
class="px-3 py-2 rounded-lg bg-red-100 text-red-700 font-bold">
Delete
</button>

</td>

</tr>

`).join("")}

</tbody>

</table>

</div>
`;

}

function deleteProduct(id){

let product=
products.find(p=>p.id===id);

if(!product)return;

if(!confirm(
`Delete ${product.name} from ${product.shopName}?`
))return;

products=
products.filter(p=>p.id!==id);

localStorage.setItem(
PRODUCTS_KEY,
JSON.stringify(products)
);

renderStats();
renderProducts();
renderShops();

alert("Product deleted by Admin.");

}

if(
localStorage.getItem("freshBasketAdminLogin")==="true"
){

showDashboard();

}

</script>

</body>
</html>
